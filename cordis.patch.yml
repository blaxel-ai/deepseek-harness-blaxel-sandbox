# Local and Blaxel execution share one DSH host. These routers preserve the
# native session model and select a backend from the active session id.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: true

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  disabled: true

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.cwd()

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: !!js process.platform === 'win32'
  config:
    timeoutMs: 300000

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: !!js process.platform !== 'win32'

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets: !!js "({ 'read-only': { sandbox: 'read-only', approval: 'ask' }, 'workspace-write': { sandbox: 'workspace-write', approval: 'ask' }, 'danger-full-access': { sandbox: 'danger-full-access', approval: 'never' } })"
    defaultPreset: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'

- insert:
    - id: blaxel-sessions
      name: '@blaxel/dsh-sandbox/session-runtime'

    - id: blaxel-subprocess-router
      name: '@blaxel/dsh-sandbox/subprocess-routing'

    - id: blaxel-filesystem-router
      name: '@blaxel/dsh-sandbox/filesystem-routing'

    # A root-package row lets DSH discover the package's browser client module.
    - id: blaxel-client
      name: '@blaxel/dsh-sandbox'

    # The host bridge creates ordinary DSH sessions and binds their execution
    # backends to Blaxel sandboxes. It never starts another Web process.
    - id: blaxel-web
      name: '@blaxel/dsh-sandbox/web'
